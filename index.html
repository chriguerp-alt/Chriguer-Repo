
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Practical 44 | Web Edition 0.7</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">44</div>
      <div>
        <h2>Practical 44</h2>
        <small>Web Edition · 0.7</small>
      </div>
    </div>

    <div class="nav-label">ESPAÇO DE TRABALHO</div>
    <nav>
      <button class="nav-item active" data-page="dashboard">⌂ Dashboard</button>
      <button class="nav-item" data-page="projects">▣ Projetos</button>
      <button class="nav-item" data-page="tasks">☑ Tarefas</button>
      <button class="nav-item" data-page="calendar">▦ Calendário</button>
      <button class="nav-item" data-page="history">◷ Histórico</button>
      <button class="nav-item" data-page="statistics">▥ Estatísticas</button>
    </nav>

    <div class="nav-label">ORGANIZAÇÃO</div>
    <nav>
      <button class="nav-item" data-page="tags">◇ Etiquetas</button>
      <button class="nav-item" data-page="notes">✎ Anotações</button>
      <button class="nav-item" data-page="trash">▤ Lixeira</button>
    </nav>

    <div class="nav-label">PREFERÊNCIAS</div>
    <nav>
      <button class="nav-item" data-page="appearance">◐ Personalização</button>
      <button class="nav-item" data-page="settings">⚙ Configurações</button>
    </nav>

    <div class="sidebar-footer">Practical 44 · 2026</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-button" id="menuButton">☰</button>
      <div>
        <span class="eyebrow">SEU PAINEL DE CONTROLE</span>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <span class="version">v0.7</span>
        <button class="primary" id="quickAdd">+ Novo</button>
      </div>
    </header>

    <section id="pageContent"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Novo item</h2>
        <button class="icon-button" id="closeModal">✕</button>
      </div>
      <form id="itemForm">
        <div id="modalFields"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="cancelModal">Cancelar</button>
          <button type="submit" class="primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
