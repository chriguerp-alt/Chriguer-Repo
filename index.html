<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chriguer Repo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background-color: #34c759;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .btn-cydia {
            background-color: #794bc4;
        }
        .btn-cydia:hover {
            background-color: #633ba3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chriguer Repo</h1>
    <p>Bem-vindo ao meu repositório oficial de tweaks!</p>
    
    <a class="btn btn-cydia" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://https://chriguerp-alt.github.io/Chriguer-Repo/">➕ Adicionar ao Cydia</a>
</div>

</body>
</html>
